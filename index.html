.top{display:flex;align-items:center;gap:12px;padding:12px 20px;padding-right:max(20px,env(safe-area-inset-right,0px));background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}

.tbl-wrap{overflow-x:auto}

  h+='<aside class="sheets"><div class="sub" style="font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:11px;margin-bottom:8px">Drawing set</div>'+SHEETS.map(function(s){return '<button class="sheet'+(S.sheet===s.id?' on':'')+'" data-sheet="'+s.id+'"><div class="mono" style="font-weight:500">'+s.id+'</div><div style="font-size:12.5px">'+s.t+'</div><div class="sub" style="font-size:11.5px">Rev '+s.rev+'</div></button>'}).join('')+'</aside>';
  h+='<div class="stack"><div class="viewer"><div class="vtools">'+
   ['A','B','C'].map(function(r){return '<button class="vt'+(S.rev===r?' on':'')+'" data-rev="'+r+'">Rev '+r+'</button>'}).join('')+'<span style="width:1px;height:18px;background:rgba(255,255,255,.2);margin:0 4px"></span>'+
   '<button class="vt" id="zin" aria-label="Zoom in">'+ic('plus',14)+'</button><button class="vt" id="zout" aria-label="Zoom out">'+ic('minus',14)+'</button><span class="vt" style="pointer-events:none">'+Math.round(S.zoom*100)+'%</span>'+
   '<button class="vt'+(S.tool==='pan'?' on':'')+'" data-tool="pan">'+ic('hand',14)+'Pan</button><button class="vt'+(S.tool==='markup'?' on':'')+'" data-tool="markup">'+ic('pen',14)+'Markup</button><button class="vt'+(S.tool==='measure'?' on':'')+'" data-tool="measure">'+ic('ruler2',14)+'Measure</button>'+
   '<span style="flex:1"></span>'+[['grid','Grid'],['struct','Structure'],['dim','Dimensions'],['note','Notes']].map(function(l){return '<button class="vt'+(S.layers[l[0]]?' on':'')+'" data-layer="'+l[0]+'">'+l[1]+'</button>'}).join('')+'<button class="vt" id="fs" aria-label="Fullscreen">'+ic('full',14)+'</button></div>'+drawing()+
   '<div style="position:absolute;left:12px;bottom:10px;display:flex;gap:12px;font-size:11.5px;color:#cfe0ff">'+(S.rev==='A'?'<span>Baseline issue. No changes shown.</span>':'<span><i style="display:inline-block;width:10px;height:10px;border:1.5px dashed #ff9d2e;margin-right:5px"></i>Added bracing</span>')+(S.rev==='C'?'<span><i style="display:inline-block;width:10px;height:10px;border:1.5px dashed #ff5d73;margin-right:5px"></i>Beam upsized</span><span><i style="display:inline-block;width:10px;height:10px;border:1.5px dashed #2ee6a8;margin-right:5px"></i>Splice moved</span>':'')+'</div></div>';
  h+='<section class="card"><div class="card-h"><h2>Approval workflow</h2>'+pill(S.stage===2?'good':'blue',['Pending Review','Under Technical Review','Approved'][S.stage])+'</div><div class="flow">'+['Pending Review','Under Technical Review','Approved'].map(function(n,i){var c=i<S.stage?'done':i===S.stage?'cur':'';return (i?'<span class="ln '+(i<=S.stage?'done':'')+'"></span>':'')+'<div class="st '+c+'"><b>'+(i<S.stage?ic('check',12,'#fff'):i+1)+'</b>'+n+'</div>'}).join('')+'</div><div style="padding:0 18px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button class="btn" id="adv">'+(S.stage<2?'Advance stage (demo)':'Reset to pending')+'</button><span class="sub" style="font-size:12px">Approval is recorded by a named engineer. The platform does not certify designs.</span></div></section></div>';
  h+='<div class="stack"><section class="card"><div class="card-h"><h2>Review comments</h2>'+pill('warn',COMMENTS.filter(function(c){return c.st!=='Resolved'}).length+' open')+'</div>'+COMMENTS.map(function(c){return '<div class="cmt'+(S.pin===c.id?' on':'')+'" data-cm="'+c.id+'"><div style="display:flex;justify-content:space-between;gap:8px"><span style="font-weight:600">'+c.id+'. '+c.who+'</span>'+pill(c.st==='Resolved'?'good':c.st==='Open'?'bad':'blue',c.st)+'</div><div class="sub" style="font-size:12px">'+c.role+' · '+c.date+' · '+c.pri+' priority</div><div style="margin:6px 0;font-size:13px">'+c.txt+'</div><div class="sub" style="font-size:12px">Assigned to '+c.to+'</div></div>'}).join('')+
   (cur&&cur.st!=='Resolved'?'<div style="padding:10px 16px;border-top:1px solid var(--line)"><button class="btn" id="resolve">'+ic('check',14)+'Mark comment '+cur.id+' resolved</button></div>':'')+'</section>'+
   '<section class="card"><div class="card-h" style="border:0"><h2>Design decision history</h2></div>'+DECISIONS.map(function(d,i){return '<button class="acc-h" data-acc="'+i+'"><span style="text-align:left">'+d.t+'</span><span style="transition:transform .25s;transform:rotate('+(S.acc[i]?180:0)+'deg)">'+ic('chev',16)+'</span></button><div class="acc-b'+(S.acc[i]?' open':'')+'"><div><div class="dec"><dl><dt>Why</dt><dd>'+d.why+'</dd><dt>Approved by</dt><dd>'+d.by+'</dd><dt>Reference</dt><dd class="mono">'+d.ref+'</dd><dt>Downstream</dt><dd>'+d.imp+'</dd></dl></div></div></div>'}).join('')+'</section></div></div>';
  $('#page').innerHTML=h;wireViewer();
}
function wireViewer(){
  var s=$('#dwg');if(!s)return;var drag=null;
  s.addEventListener('pointerdown',function(e){if(e.target.closest('.pin'))return;drag={x:e.clientX,y:e.clientY,px:S.px,py:S.py};s.setPointerCapture(e.pointerId)});
  s.addEventListener('pointermove',function(e){if(!drag||S.tool!=='pan')return;var k=900/s.getBoundingClientRect().width;S.px=drag.px+(e.clientX-drag.x)*k;S.py=drag.py+(e.clientY-drag.y)*k;$('#vp').setAttribute('transform','translate('+S.px+' '+S.py+') scale('+S.zoom+')')});
  s.addEventListener('pointerup',function(e){if(drag&&S.tool==='markup'&&Math.abs(e.clientX-drag.x)<4){toast('Markup mode: comment pin placement is a demo interaction')}drag=null});
  s.addEventListener('wheel',function(e){e.preventDefault();zoom(e.deltaY<0?1.1:.9)},{passive:false});
}
function zoom(f){S.zoom=Math.max(.5,Math.min(3,S.zoom*f));vEng()}

/* ---------- placeholder ---------- */
function vSoon(){
  var n=NAV.filter(function(x){return x[0]===S.route})[0]||NAV[0];
  $('#page').innerHTML='<div class="head"><div><h1>'+n[1]+'</h1></div></div><section class="card"><div class="empty"><div class="big">'+ic(n[2],30)+'</div><h2 style="font-size:17px">'+n[1]+' is planned for the next build phase</h2><div class="sub" style="max-width:420px">This phase includes the dashboard and the Design & Engineering workspace. The remaining screens will reuse the same components.</div><button class="btn pri" data-go="engineering">Open Design & Engineering</button></div></section>';
}

/* ---------- post-render ---------- */
function afterRender(){
  setTimeout(function(){$$('.bar i[data-w]').forEach(function(e){e.style.width=e.dataset.w+'%'})},40);
  $$('[data-count]').forEach(function(e){var v=+e.dataset.count;if(reduce){e.textContent=v;return}var t0=performance.now();(function f(t){var k=Math.min(1,(t-t0)/900);e.textContent=Math.round(v*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)})(t0)});
}

/* ---------- events (delegated) ---------- */
document.addEventListener('click',function(e){
  var t=e.target,g;
  if(!t.closest('#bell')&&!t.closest('#prof')&&!t.closest('.menu')&&S.menu){S.menu=null;renderTop()}
  if(g=t.closest('[data-r]')){setRoute(g.dataset.r);if(window.innerWidth<761){S.collapsed=true;renderRail()}return}
  if(g=t.closest('[data-go]')){$('#overlay').innerHTML='';S.menu=null;setRoute(g.dataset.go);return}
  if(t.closest('#collapse')||t.closest('#burger')){S.collapsed=!S.collapsed;$('#rail').classList.toggle('collapsed',S.collapsed);return}
  if(t.closest('#bell')){S.menu=S.menu==='bell'?null:'bell';renderTop();return}
  if(t.closest('#prof')){S.menu=S.menu==='prof'?null:'prof';renderTop();return}
  if(t.closest('#signout')){S.menu=null;renderTop();toast('Demo session. No account to sign out of.');return}
  if(t.closest('#theme')){var d=document.documentElement,cur=d.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'),nx=cur==='dark'?'light':'dark';d.setAttribute('data-theme',nx);try{localStorage.setItem('sf-theme',nx)}catch(x){};return}
  if(g=t.closest('[data-t]')){toast(g.dataset.t);return}
  if(g=t.closest('[data-f]')){S.filter=g.dataset.f;vOverview();afterRender();return}
  if(g=t.closest('[data-c]')){S.chart=g.dataset.c;$$('#cm button').forEach(function(b){b.classList.toggle('on',b.dataset.c===S.chart)});drawChart();return}
  if(g=t.closest('[data-open]')){openProject(g.dataset.open);return}
  if(t.closest('#closem')||t.id==='scrim'){$('#overlay').innerHTML='';return}
  if(t.closest('#newproj')){$('#overlay').innerHTML='<div class="scrim" id="scrim"><form class="modal" id="npf"><h1 style="font-size:18px;margin-bottom:14px">New project</h1><div class="field">Project name<input id="np-n" placeholder="e.g. Eastern Rail Depot" required></div><div class="field">Project manager<select id="np-m">'+PROJ.map(function(p){return '<option>'+p.pm+'</option>'}).join('')+'</select></div><div class="field">Target completion<input id="np-d" type="date"></div><div style="display:flex;justify-content:flex-end;gap:8px"><button type="button" class="btn" id="closem">Cancel</button><button class="btn pri" type="submit">Create project</button></div></form></div>';setTimeout(function(){var i=$('#np-n');i&&i.focus()},50);return}
  /* engineering */
  if(g=t.closest('[data-rev]')){S.rev=g.dataset.rev;vEng();return}
  if(g=t.closest('[data-sheet]')){S.sheet=g.dataset.sheet;vEng();return}
  if(g=t.closest('[data-layer]')){S.layers[g.dataset.layer]=!S.layers[g.dataset.layer];vEng();return}
  if(g=t.closest('[data-tool]')){S.tool=g.dataset.tool;if(S.tool==='measure')toast('Measure: 12 000 mm between grids B and C (demo)');vEng();return}
  if(g=t.closest('[data-pin]')){S.pin=+g.dataset.pin;vEng();return}
  if(g=t.closest('[data-cm]')){S.pin=+g.dataset.cm;vEng();return}
  if(g=t.closest('[data-acc]')){var i=+g.dataset.acc;S.acc[i]=!S.acc[i];var b=g.nextElementSibling;b.classList.toggle('open',S.acc[i]);g.lastElementChild.style.transform='rotate('+(S.acc[i]?180:0)+'deg)';return}
  if(t.closest('#zin')){zoom(1.25);return} if(t.closest('#zout')){zoom(.8);return}
  if(t.closest('#fs')){var v=$('.viewer');if(v&&v.requestFullscreen)v.requestFullscreen().catch(function(){toast('Fullscreen is not available here')});else toast('Fullscreen is not available here');return}
  if(t.closest('#adv')){S.stage=S.stage<2?S.stage+1:0;vEng();toast(S.stage===2?'Marked approved by reviewer (demo)':S.stage===0?'Reset to pending review':'Moved to technical review');return}
  if(t.closest('#resolve')){COMMENTS.forEach(function(c){if(c.id===S.pin)c.st='Resolved'});vEng();toast('Comment resolved and logged');return}
});
document.addEventListener('submit',function(e){e.preventDefault();if(e.target.id==='npf'){var n=$('#np-n').value.trim();$('#overlay').innerHTML='';PROJ.unshift({n:n,c:'ACU-2026-0'+(40+PROJ.length),pm:$('#np-m').value,pr:2,ph:'Concept & Planning',h:'good',d:$('#np-d').value||'TBC',m:[1,0,0,0,0]});toast('Project created: '+n);if(S.route==='overview')vOverview();afterRender()}});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){$('#overlay').innerHTML='';S.menu=null;renderTop()}if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();var g=$('#gs');g&&g.focus()}});
document.addEventListener('input',function(e){if(e.target.id==='gs'){var q=e.target.value.toLowerCase();if(S.route==='overview'||S.route==='projects'){$$('tr.row').forEach(function(r){r.style.display=r.textContent.toLowerCase().indexOf(q)>-1?'':'none'})}}});
window.addEventListener('hashchange',function(){var h=location.hash.slice(1);if(h&&h!==S.route&&NAV.some(function(n){return n[0]===h})){S.route=h;render()}});

/* boot: skeleton, then content */
var h0=location.hash.slice(1);if(h0&&NAV.some(function(n){return n[0]===h0}))S.route=h0;
renderRail();renderTop();
$('#content').innerHTML='<div class="grid4">'+[1,2,3,4].map(function(){return '<div class="card pad"><div class="skel" style="height:12px;width:60%"></div><div class="skel" style="height:30px;width:40%;margin:12px 0"></div><div class="skel" style="height:10px;width:80%"></div></div>'}).join('')+'</div>';
setTimeout(render,reduce?0:450);
})();
</script>
